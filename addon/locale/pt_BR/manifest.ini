summary = "CMDReader"
description = """Lê automaticamente novas saídas no Prompt de Comando, PowerShell e Windows Terminal em tempo real, com alertas sonoros para estados de pronto, concluído e erro. A revisão por linha permite ler a saída do console linha por linha com as setas para cima e para baixo. Um painel de configurações oferece palavras-chave de erro personalizadas e Modo de Privacidade Rigorosa.

Teclas de Atalho:
CTRL+ALT+L
um toque : Alternar revisão por linha (as setas para cima e para baixo leem a saída do console linha por linha)
dois toques : Abrir arquivo do CMDReader
três toques : Abrir configurações do CMDReader"""