summary = "CMDReader"
description = """Lê automaticamente novas saídas no Prompt de Comando (Command Prompt), PowerShell e Windows Terminal em tempo real. Possui notificações de áudio instantâneas para estados e erros do terminal, palavras-chave de erro personalizáveis, um painel de configurações do NVDA dedicado para gerenciamento de privacidade e rolagem do histórico de sessão ao vivo (shadow history) sem interromper seu fluxo de trabalho.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""