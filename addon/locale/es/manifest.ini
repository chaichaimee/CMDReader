summary = "CMDReader"
description = """Lee automáticamente las nuevas salidas en Símbolo del sistema, PowerShell y Windows Terminal en tiempo real, con alertas sonoras para los estados de listo, finalizado y error. La revisión por líneas permite leer la salida de la consola línea por línea con las flechas Arriba y Abajo. Un panel de configuración ofrece palabras clave de error personalizadas y el Modo de Privacidad Estricta.

Teclas rápidas:
CTRL+ALT+L
una sola pulsación : Alternar revisión por líneas (las flechas Arriba y Abajo leen la salida de la consola línea por línea)
doble pulsación : Abrir archivo de CMDReader
triple pulsación : Abrir configuración de CMDReader"""