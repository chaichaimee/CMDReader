summary = "CMDReader"
description = """Lee automáticamente las nuevas salidas en el Símbolo del sistema (Command Prompt), PowerShell y Windows Terminal en tiempo real. Cuenta con notificaciones de audio instantáneas para estados y errores de la terminal, palabras clave de error personalizables, un panel de configuración de NVDA dedicado para la gestión de la privacidad y desplazamiento por el historial de la sesión en vivo (shadow history) sin interrumpir su flujo de trabajo.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""