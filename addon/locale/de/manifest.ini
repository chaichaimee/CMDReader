summary = "CMDReader"
description = """Liest neue Ausgaben in Eingabeaufforderung, PowerShell und Windows Terminal in Echtzeit automatisch vor, mit akustischen Signalen für Bereit-, Fertig- und Fehlerzustände. Die Zeilenprüfung ermöglicht das zeilenweise Lesen der Konsolenausgabe mit den Pfeiltasten Oben und Unten. Ein Einstellungsdialog bietet benutzerdefinierte Fehler-Schlüsselwörter und den strengen Datenschutzmodus.

Tastenkombinationen:
STRG+ALT+L
Einfach tippen: Zeilenprüfung umschalten (Pfeiltasten Oben und Unten lesen die Konsolenausgabe zeilenweise vor)
Doppelt tippen: CMDReader-Datei öffnen
Dreifach tippen: CMDReader-Einstellungen öffnen"""