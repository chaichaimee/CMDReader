summary = "CMDReader"
description = """Liest automatisch neue Ausgaben in Eingabeaufforderung (Command Prompt), PowerShell und Windows Terminal in Echtzeit vor. Bietet sofortige akustische Benachrichtigungen für Terminalstatus und Fehler, anpassbare Fehler-Schlüsselwörter, ein dediziertes NVDA-Einstellungsfeld zur Datenschutzverwaltung sowie das direkte Durchblättern des Sitzungsverlaufs (Shadow History), ohne Ihren Arbeitsablauf zu unterbrechen.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""