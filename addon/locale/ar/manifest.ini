summary = "قارئ الأوامر"
description = """يقرأ تلقائياً المخرجات الجديدة في موجه الأوامر، وباورشل، وويندوز ترمينال في الوقت الفعلي، مع تنبيهات صوتية لحالات الاستعداد، والانتهاء، والخطأ. يتيح لك استعراض الأسطر قراءة مخرجات وحدة التحكم سطراً بسطر باستخدام سهمي الأعلى والأسفل. توفر لوحة الإعدادات كلمات مفتاحية مخصصة للأخطاء وضع الخصوصية الصارمة.

مفاتيح الاختصار:
CTRL+ALT+L
نقرة واحدة: تبديل استعراض الأسطر (سهما الأعلى والأسفل يقرءان مخرجات وحدة التحكم سطراً بسطر)
نقرة مزدوجة: فتح ملف قارئ الأوامر
ثلاث نقرات: فتح إعدادات قارئ الأوامر"""