summary = "CMDReader"
description = """يقوم تلقائياً بقراءة المخرجات الجديدة في موجه الأوامر Command Prompt وPowerShell وWindows Terminal في الوقت الفعلي. يتضمن تنبيهات صوتية فورية لحالة الطرفية والأخطاء، وكلمات مفتاحية مخصصة للأخطاء، لوحة إعدادات NVDA مخصصة لإدارة الخصوصية، والتمرير المباشر لسجل الجلسة السابق (Shadow History) دون تعطيل سير عملك.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""