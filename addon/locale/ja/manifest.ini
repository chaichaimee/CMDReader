summary = "CMDReader"
description = """コマンドプロンプト、PowerShell、Windows Terminalの新しい出力をリアルタイムで自動読み上げし、準備完了、完了、エラー状態を効果音で通知します。ラインレビュー機能を使用すると、上下矢印キーでコンソール出力を1行ずつ確認できます。設定パネルでは、カスタムエラーキーワードや厳格なプライバシーモードを設定できます。

ホットキー:
CTRL+ALT+L
1回タップ: ラインレビューの切り替え（上下矢印キーでコンソール出力を1行ずつ読み上げます）
2回タップ: CMDReaderファイルを開く
3回タップ: CMDReader設定を開く"""