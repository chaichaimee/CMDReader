summary = "CMDReader"
description = """コマンドプロンプト (Command Prompt)、PowerShell、Windows Terminal の新しい出力をリアルタイムで自動的に読み上げます。ターミナルの状態やエラーに関する即時音声通知、カスタマイズ可能なエラーキーワード、プライバシー管理用の専用 NVDA 設定パネルを備え、ワークフローを中断することなくライブセッションのシャドウ履歴をスクロールできます。
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""