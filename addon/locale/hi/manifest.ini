summary = "CMDReader"
description = """कमांड प्रॉम्प्ट, पॉवरशेल और विंडोज टर्मिनल में नए आउटपुट को वास्तविक समय में स्वचालित रूप से पढ़ता है, जिसमें तैयार, पूर्ण और त्रुटि स्थितियों के लिए ध्वनि अलर्ट होते हैं। लाइन रिव्यू आपको अप और डाउन तीर कुंजियों के साथ कंसोल आउटपुट को एक समय में एक लाइन पढ़ने की अनुमति देता है। सेटिंग्स पैनल कस्टम त्रुटि कीवर्ड और सख्त गोपनीयता मोड प्रदान करता है।

हॉटकी:
CTRL+ALT+L
सिंगल टैप : लाइन रिव्यू टॉगल करें (अप और डाउन तीर कुंजियाँ कंसोल आउटपुट को एक समय में एक लाइन पढ़ती हैं)
डबल टैप : CMDReader फ़ाइल खोलें
ट्रिपल टैप : CMDReader सेटिंग्स खोलें"""