summary = "CMDReader"
description = """Command Prompt, PowerShell और Windows Terminal में नए आउटपुट को वास्तविक समय (real-time) में स्वचालित रूप से पढ़ता है। इसमें टर्मिनल स्थितियों और त्रुटियों (errors) के लिए त्वरित ऑडियो सूचनाएं, अनुकूलन योग्य त्रुटि कीवर्ड, गोपनीयता प्रबंधन के लिए एक समर्पित NVDA सेटिंग्स पैनल, और आपके कार्यप्रवाह को बाधित किए बिना लाइव सत्र शैडो इतिहास (shadow history) स्क्रॉलिंग की सुविधा शामिल है।
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""