summary = "CMDReader"
description = """Legge automaticamente in tempo reale i nuovi output in Prompt dei comandi (Command Prompt), PowerShell e Windows Terminal. Dispone di notifiche audio istantanee per gli stati e gli errori del terminale, parole chiave di errore personalizzabili, un pannello delle impostazioni NVDA dedicato alla gestione della privacy e lo scorrimento della cronologia di sessione in tempo reale (shadow history) senza interrompere il flusso di lavoro.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""