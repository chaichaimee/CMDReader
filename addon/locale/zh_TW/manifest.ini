summary = "CMDReader"
description = """即時自動讀取命令提示字元（Command Prompt）、PowerShell 與 Windows Terminal 中的新輸出。具備終端機狀態與錯誤的即時音效通知、可自訂的錯誤關鍵字、用於隱私管理的專用 NVDA 設定面板，以及在不打斷工作流程的情況下即時捲動工作階段幕後歷史記錄（shadow history）的功能。
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""