summary = "CMDReader"
description = """Lit automatiquement en temps réel les nouvelles sorties dans l'Invite de commandes (Command Prompt), PowerShell et Windows Terminal. Comprend des notifications audio instantanées pour les états et les erreurs du terminal, des mots-clés d'erreur personnalisables, un panneau de configuration NVDA dédié à la gestion de la confidentialité, ainsi que le défilement en direct de l'historique de session (shadow history) sans perturber votre flux de travail.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""