summary = "CMDReader"
description = """Lit automatiquement la nouvelle sortie dans l'Invite de commandes, PowerShell et Windows Terminal en temps réel, avec des alertes sonores pour les états prêt, terminé et erreur. La relecture par ligne vous permet de lire la sortie de la console ligne par ligne avec les flèches Haut et Bas. Un panneau de configuration propose des mots-clés d'erreur personnalisés et un mode de confidentialité stricte.

Raccourcis clavier :
CTRL+ALT+L
appui simple : Basculer la relecture par ligne (les flèches Haut et Bas lisent la sortie de la console ligne par ligne)
double appui : Ouvrir le fichier CMDReader
triple appui : Ouvrir les paramètres de CMDReader"""