summary = "CMDReader"
description = """อ่านข้อความเอาต์พุตใหม่ใน Command Prompt, PowerShell และ Windows Terminal แบบเรียลไทม์โดยอัตโนมัติ มาพร้อมกับการแจ้งเตือนด้วยเสียงทันทีเมื่อมีสถานะหรือข้อผิดพลาดในเทอร์มินัล, กำหนดคำสำคัญของข้อผิดพลาดได้เอง, แผงตั้งค่า NVDA เฉพาะสำหรับจัดการความเป็นส่วนตัว และการเลื่อนดูประวัติเซสชันย้อนหลัง (shadow history) แบบสดๆ โดยไม่ขัดจังหวะการทำงานของคุณ
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""