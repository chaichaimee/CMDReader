summary = "ซีเอ็มดีรีดเดอร์ (CMDReader)"
description = """อ่านข้อความใหม่ในคอมมานด์พรอมต์ เพาเวอร์เชลล์ และวินโดวส์เทอร์มินัลแบบเรียลไทม์โดยอัตโนมัติ พร้อมเสียงแจ้งเตือนสถานะพร้อมทำงาน ทำงานเสร็จ และเกิดข้อผิดพลาด การทบทวนบรรทัดช่วยให้คุณอ่านข้อความเอาต์พุตของคอนโซลทีละบรรทัดได้ด้วยลูกศรขึ้นและลง แผงการตั้งค่ามีคำสำคัญสำหรับข้อผิดพลาดที่กำหนดเองและโหมดความเป็นส่วนตัวเข้มงวด

ปุ่มลัด:
CTRL+ALT+L
แตะครั้งเดียว : สลับการทบทวนบรรทัด (ลูกศรขึ้นและลงจะอ่านข้อความเอาต์พุตของคอนโซลทีละบรรทัด)
แตะสองครั้ง : เปิดไฟล์ CMDReader
แตะสามครั้ง : เปิดการตั้งค่า CMDReader"""