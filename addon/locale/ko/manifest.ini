summary = "CMDReader"
description = """명령 Prompt, PowerShell, Windows Terminal의 새로운 출력을 실시간으로 자동 읽어주며, 준비, 완료, 오류 상태에 대한 사운드 알림을 제공합니다. 줄 검토 기능을 사용하면 위/아래 화살표를 눌러 콘솔 출력을 한 줄씩 읽을 수 있습니다. 설정 패널에서는 사용자 정의 오류 키워드와 엄격한 개인정보 보호 모드를 제공합니다.

단축키:
CTRL+ALT+L
한 번 탭: 줄 검토 토글 (위/아래 화살표로 콘솔 출력을 한 줄씩 읽기)
두 번 탭: CMDReader 파일 열기
세 번 탭: CMDReader 설정 열기"""