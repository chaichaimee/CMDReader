summary = "CMDReader"
description = """명령 프롬프트(Command Prompt), PowerShell 및 Windows Terminal의 새로운 출력을 실시간으로 자동 읽어줍니다. 터미널 상태 및 오류에 대한 즉각적인 오디오 알림, 사용자 지정 가능한 오류 키워드, 개인정보 보호 관리를 위한 전용 NVDA 설정 패널을 제공하며, 작업 흐름을 방해하지 않고 실시간 세션 섀도 기록(shadow history)을 스크롤할 수 있습니다.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""