summary = "CMDReader"
description = """Автоматично озвучує новий вивід у командному рядку, PowerShell та Windows Terminal у реальному часі з різними звуковими сигналами для станів готовності, завершення та помилки. Режим перегляду рядків дозволяє читати вивід консолі по одному рядку за допомогою стрілок вгору та вниз. Панель налаштувань пропонує власні ключові слова помилок і суворий режим конфіденційності.

Гарячі клавіші:
CTRL+ALT+L
одинарне натискання : Увімкнути/вимкнути перегляд рядків (стрілки вгору та вниз читають вивід консолі по одному рядку)
подвійне натискання : Відкрити файл CMDReader
потрійне натискання : Відкрити налаштування CMDReader"""