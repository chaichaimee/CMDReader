summary = "CMDReader"
description = """Автоматично читає новий вивід у Командному рядку (Command Prompt), PowerShell та Windows Terminal у реальному часі. Містить миттєві звукові сповіщення про стан термінала та помилки, налаштовувані ключові слова помилок, спеціальну панель налаштувань NVDA для керування конфіденційністю, а також прокручування історії поточної сесії (shadow history) без переривання вашого робочого процесу.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""