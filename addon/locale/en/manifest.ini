summary = "CMDReader"
description = """Automatically reads new output in Command Prompt, PowerShell, and Windows Terminal in real time, with sound alerts for ready, finished, and error states. Line review lets you read console output one line at a time with the Up and Down arrows. A settings panel offers custom error keywords and Strict Privacy Mode.

Hot Keys:
CTRL+ALT+L
single tap : Toggle line review (Up and Down arrows read the console output one line at a time)
 double tap : Open CMDReader file
 triple tap : Open CMDReader settings"""