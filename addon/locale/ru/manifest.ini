summary = "CMDReader"
description = """Автоматически читает новый вывод в Командной строке (Command Prompt), PowerShell и Windows Terminal в реальном времени. Включает мгновенные звуковые уведомления о состоянии терминала и ошибках, настраиваемые ключевые слова ошибок, специальную панель настроек NVDA для управления конфиденциальностью, а также прокрутку истории текущей сессии (shadow history) без прерывания вашего рабочего процесса.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""