summary = "CMDReader"
description = """Автоматически озвучивает новый вывод в Командной строке, PowerShell и Windows Terminal в реальном времени, со звуковыми оповещениями о готовности, завершении и ошибках. Построчный просмотр позволяет читать вывод консоли по одной строке с помощью стрелок Вверх и Вниз. Панель настроек предлагает пользовательские ключевые слова ошибок и Режим строгой конфиденциальности.

Горячие клавиши:
CTRL+ALT+L
одинарное нажатие : Переключить построчный просмотр (стрелки Вверх и Вниз читают вывод консоли по одной строке)
двойное нажатие : Открыть файл CMDReader
тройное нажатие : Открыть настройки CMDReader"""