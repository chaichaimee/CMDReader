summary = "CMDReader"
description = """Secara otomatis membaca output baru di Command Prompt, PowerShell, dan Windows Terminal secara real-time, dengan peringatan suara untuk status siap, selesai, dan galeri. Peninjauan baris memungkinkan Anda membaca output konsol baris demi baris menggunakan tombol Panah Atas dan Panah Bawah. Panel pengaturan menawarkan kata kunci galeri kustom dan Mode Privasi Ketat.

Tombol Pintas:
CTRL+ALT+L
ketuk sekali : Alihkan peninjauan baris (Panah Atas dan Bawah membaca output konsol baris demi baris)
ketuk dua kali : Buka file CMDReader
ketuk tiga kali : Buka pengaturan CMDReader"""