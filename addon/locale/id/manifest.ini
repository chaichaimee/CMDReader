summary = "CMDReader"
description = """Secara otomatis membaca keluaran baru di Command Prompt, PowerShell, dan Windows Terminal secara real-time. Dilengkapi dengannotifikasi audio instan untuk status terminal dan galat (error), kata kunci galat yang dapat disesuaikan, panel pengaturan NVDA khusus untuk manajemen privasi, serta penelusuran riwayat sesi langsung (shadow history) tanpa mengganggu alur kerja Anda.
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""