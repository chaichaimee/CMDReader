summary = "CMDReader"
description = """实时自动读取命令提示符（Command Prompt）、PowerShell 和 Windows Terminal 中的新输出。具备终端状态和错误的即时音频通知、可自定义的错误关键词、用于隐私管理的专用 NVDA 设置面板，以及在不打断工作流的情况下实时浏览会话影子历史（shadow history）的功能。
Hot Keys:
CTRLALT+L : Open CMDReader File
ctrl+alt+up arrow : Read the previous line
ctrl+alt+down arrow : Read the next line"""